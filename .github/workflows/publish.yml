name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance

    steps:
      - uses: actions/checkout@v4.2.2

      # The git tag is the single source of truth for the release version.
      # package.json carries a placeholder (0.0.0-dev) that is never published;
      # the real version is written into it below, just before `npm publish`.
      - name: Resolve release version and dist-tag
        id: release
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semver release tag (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi

          # Any semver prerelease (0.1.0-rc2, 0.2.0-next.3, ...) ships to 'next',
          # so it never becomes what a bare `npm install` resolves to.
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi

          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION with dist-tag '$DIST_TAG'."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Runs after the gates so they execute against the committed tree; the
      # only difference at publish time is the version field. Not committed.
      - name: Stamp version from tag
        run: |
          set -euo pipefail
          npm version "${{ steps.release.outputs.version }}" \
            --no-git-tag-version --allow-same-version
          echo "package.json version is now $(node -p "require('./package.json').version")"

      - run: npm publish --provenance --access public --tag ${{ steps.release.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
